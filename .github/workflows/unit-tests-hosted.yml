name: Unit Tests (hosted)

# Cluster-independent unit tests on a cheap GitHub-hosted runner, meant to be
# the REQUIRED status check that gates merges into develop/master. The deep
# tiers stay on the self-hosted Windows/SLURM runners ("Python Unit Tests",
# "Cluster Tests (SLURM)"), which need lab hardware + Confluence secrets and
# are unavailable on forks — so they should NOT be required checks.
#
# Setup mirrors the headless dev container:
#   * base install is wheel-only (the CZI stack lives in the optional [formats]
#     extra); picassosr's 0.11 alpha resolves from PyPI as a pre-release because
#     the pin references one.
#   * the Qt runtime libs + QT_QPA_PLATFORM=offscreen let the GUI unit tests
#     import PyQt6 without a display.
# `pytest` runs the unit tier only (integration/real_data are deselected by the
# addopts in pyproject.toml). picasso is mocked in this tier, so no data or
# network is needed.

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    # Test the declared-supported Python range (requires-python >= 3.11), not
    # just the floor -- mirrors the sibling repos (monet / picasso-registry /
    # PycroFlow). Each leg reports its own status check ("unit-tests (3.11)" ...
    # "unit-tests (3.14)"); add the ones that should gate merges to branch
    # protection. 3.13/3.14 are exploratory (a brand-new CPython can outrun
    # wheels for numpy/PyQt6/picassosr), so fail-fast is off -- a red new-Python
    # leg must not cancel the supported 3.11/3.12 legs.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # setuptools-scm needs full history for the version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries (headless PyQt6 import)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install package (wheel-only base)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gui,binding-events]"

      - name: Run unit tests
        run: pytest
