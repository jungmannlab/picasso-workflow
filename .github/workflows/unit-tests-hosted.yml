name: Unit Tests (hosted)

# Cluster-independent unit tests on a cheap GitHub-hosted runner, meant to be
# the REQUIRED status check that gates merges into develop/master. The deep
# tiers stay on the self-hosted Windows/SLURM runners ("Python Unit Tests",
# "Cluster Tests (SLURM)"), which need lab hardware + Confluence secrets and
# are unavailable on forks — so they should NOT be required checks.
#
# Setup mirrors the headless dev container:
#   * base install is wheel-only (the CZI stack lives in the optional [formats]
#     extra); picassosr's 0.11 alpha resolves from PyPI as a pre-release because
#     the pin references one.
#   * the Qt runtime libs + QT_QPA_PLATFORM=offscreen let the GUI unit tests
#     import PyQt6 without a display.
# `pytest` runs the unit tier only (integration/real_data are deselected by the
# addopts in pyproject.toml). picasso is mocked in this tier, so no data or
# network is needed.

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Qt runtime libraries (headless PyQt6 import)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install package (wheel-only base)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run unit tests
        run: pytest
