# Build the cluster Apptainer image (register C10 / WP-9) in CI.
#
# Builds the `.sif` from `deploy/apptainer/paint.def` on a hosted runner (which
# has the privilege Apptainer's fakeroot build needs) and publishes it. The
# image is NOT auto-deployed to the cluster: compute nodes have no internet, so
# someone pulls the published artifact on the LOGIN node to the shared path
# (e.g. /sw/picasso-workflow-<version>.sif) and jobs `apptainer exec` from there
# (C48 distribution scheme).
#
# Naming (C48): the published file carries the PRIMARY CONSUMER's version
# (picasso_workflow.__version__) — that is the key the submitter matches on
# (WP-9 cluster_submit resolves its installed __version__ -> image_path):
#   • release build  -> picasso-workflow-<version>.sif
#   • rolling develop -> picasso-workflow-develop-<short-sha>.sif
# The login-node pull is what (re)points the `picasso-workflow-develop.sif`
# symlink; CI only produces the sha-stamped file.

name: build-apptainer-image

on:
  workflow_dispatch:
    inputs:
      pw_ref:
        description: "picasso-workflow git ref to bake in (tag for a release build)"
        required: true
        default: "develop"      # picasso-1.0 migration merged to develop (PR #77, 2026-10-28)
  release:
    types: [published]          # build on each GitHub release (reproducible = a tag)
  # Build-smoke on any change to the recipe or this workflow: proves paint.def
  # still builds + imports headlessly before it merges. Scoped by path so the
  # ~1-2 GB build only runs when these files change (they rarely do).
  pull_request:
    paths:
      - "deploy/apptainer/**"
      - ".github/workflows/build-apptainer.yml"

permissions:
  contents: write               # upload the .sif as a release asset
  packages: write               # push the image to ghcr via ORAS

jobs:
  build:
    # ubuntu-22.04 (jammy), NOT ubuntu-latest (now 24.04/noble): the Apptainer
    # .deb depends on libfuse3-3, which noble replaced with libfuse3-4 -> the
    # install fails with "libfuse3-3 … not installable". jammy still ships it.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The image is ~1-2 GB (numba + scipy + the picasso stack); free runner disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL || true
          df -h /

      # Pin to <= the cluster's Apptainer (hpcl8 = 1.4.1): a .sif built by an
      # equal/older Apptainer runs on the cluster; a much newer one may not.
      - uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.6

      - name: Build the image
        env:
          # Override PW_REF only for release (bake the tag) and dispatch (bake the
          # input). On pull_request github.ref_name is the synthetic "<n>/merge"
          # ref, which is NOT a fetchable git ref — leave PW_REF empty so the def's
          # own pin (develop) is used and the clone resolves.
          PW_REF: ${{ github.event.inputs.pw_ref || (github.event_name == 'release' && github.ref_name) || '' }}
        run: |
          export APPTAINER_TMPDIR="$RUNNER_TEMP/apptainer-tmp"
          mkdir -p "$APPTAINER_TMPDIR"
          # bake the chosen ref into the def (paint.def hard-codes PW_REF); skip on
          # PR builds, which validate the def exactly as written (PW_REF=develop).
          if [ -n "$PW_REF" ]; then
            sed -i "s|^    PW_REF=.*|    PW_REF=\"${PW_REF}\"|" deploy/apptainer/paint.def
          fi
          echo "Building with PW_REF=$(grep -oP '^\s*PW_REF=\"\K[^\"]+' deploy/apptainer/paint.def)"
          apptainer build build.sif deploy/apptainer/paint.def

      - name: Smoke-test the image (imports the stack headlessly)
        run: apptainer test build.sif

      # C48 naming: filename = the picasso-workflow version (the submit-time match
      # key). Read it from the installed package METADATA via importlib.metadata,
      # not from picasso_workflow._version — that file is setuptools-scm-generated
      # and gitignored, so it isn't reliably shipped in the wheel (hence the
      # try/except in __init__). The dist-info version is always present.
      - name: Resolve C48 image name
        id: name
        run: |
          VERSION=$(apptainer exec build.sif \
            python -c "from importlib.metadata import version; print(version('picasso_workflow'))")
          if [ "${{ github.event_name }}" = "release" ]; then
            OUT="picasso-workflow-${VERSION}.sif"
            TAG="$VERSION"
          else
            OUT="picasso-workflow-develop-${GITHUB_SHA::7}.sif"
            TAG="develop-${GITHUB_SHA::7}"
          fi
          # OCI tags can't contain '+'; setuptools-scm local versions do (e.g.
          # 0.3.4.dev5+g1a2b3c4) -> sanitize for the ghcr tag.
          TAG=$(echo "$TAG" | tr '+' '-')
          mv build.sif "$OUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sif=$OUT"         >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "Built $OUT (picasso_workflow $VERSION), ghcr tag $TAG"

      # --- publish -------------------------------------------------------------
      # A) ephemeral CI artifact (always; good for verifying a build / dispatch).
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.sif }}
          path: ${{ steps.name.outputs.sif }}

      # B) durable GitHub release asset (login node pulls it with curl/wget).
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: ${{ steps.name.outputs.sif }}

      # C) ghcr via ORAS — the C48-RECOMMENDED target. The login node pulls with
      #    `apptainer pull oras://ghcr.io/<owner>/picasso-workflow:<tag>`. Skipped on
      #    pull_request: a PR smoke-build must not publish, and a fork PR's
      #    GITHUB_TOKEN has no packages:write anyway.
      #    NOTE: the first push creates a PRIVATE ghcr package — make it public (or
      #    give the login node a pull token) so compute-node pulls work.
      - name: Publish to ghcr (ORAS)
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | \
            apptainer registry login -u "${{ github.actor }}" --password-stdin oras://ghcr.io
          repo="oras://ghcr.io/${{ github.repository_owner }}/picasso-workflow"
          apptainer push "${{ steps.name.outputs.sif }}" "${repo}:${{ steps.name.outputs.tag }}"
          # keep a moving :develop tag at the latest rolling build (release pushes
          # only the immutable :<version> tag).
          if [ "${{ github.event_name }}" != "release" ]; then
            apptainer push "${{ steps.name.outputs.sif }}" "${repo}:develop"
          fi

# --- Private-repo adaptation (only if a jungmannlab repo becomes private) -------
# Don't put a git token inside %post (it can leak into the image). Instead:
#   1. actions/checkout the repo(s) with a PAT into ./ctx/picasso-workflow etc.
#   2. use a CI def with a `%files` section that COPIES ./ctx/* into the image and
#      `pip install`s from those local paths (no in-image git auth).
