# Build the cluster Apptainer image(s) (register C10 / WP-9) in CI.
#
# Builds the `.sif` from `deploy/apptainer/paint.def` on a hosted runner (which
# has the privilege Apptainer's fakeroot build needs) and publishes it. The
# image is NOT auto-deployed to the cluster: compute nodes have no internet, so
# someone pulls the published artifact on the LOGIN node to the shared path
# (e.g. /sw/picasso-workflow-<version>.sif) and jobs `apptainer exec` from there
# (C48 distribution scheme).
#
# Two VARIANTS are built from the one recipe (matrix):
#   • lean -> picasso-workflow[-develop-<sha>]-<version>.sif   (PW_EXTRAS="")
#            the aggregation/analysis image; no pytest, stays small.
#   • test -> picasso-workflow-test[-develop-<sha>]-<version>.sif  (PW_EXTRAS="[dev]")
#            adds the [dev] extra (pytest) so the admin console's in-container
#            test chain (`pytest --pyargs picasso_workflow`) can run inside it.
#
# Naming (C48): the published file carries the PRIMARY CONSUMER's version
# (picasso_workflow.__version__) — that is the key the submitter matches on
# (WP-9 cluster_submit resolves its installed __version__ -> image_path):
#   • release build  -> picasso-workflow[-test-]<version>.sif
#   • rolling develop -> picasso-workflow[-test-]develop-<short-sha>.sif
# The login-node pull is what (re)points the `picasso-workflow-develop.sif`
# symlink; CI only produces the sha-stamped file.

name: build-apptainer-image

on:
  workflow_dispatch:
    inputs:
      pw_ref:
        description: "picasso-workflow git ref to bake in (tag for a release build)"
        required: true
        default: "develop"      # picasso-1.0 migration merged to develop (PR #77, 2026-10-28)
  release:
    types: [published]          # build on each GitHub release (reproducible = a tag)
  # Build-smoke on any change to the recipe or this workflow: proves paint.def
  # still builds + imports headlessly before it merges. Scoped by path so the
  # ~1-2 GB build only runs when these files change (they rarely do).
  pull_request:
    paths:
      - "deploy/apptainer/**"
      - ".github/workflows/build-apptainer.yml"

permissions:
  contents: write               # upload the .sif as a release asset

jobs:
  build:
    # ubuntu-22.04 (jammy), NOT ubuntu-latest (now 24.04/noble): the Apptainer
    # .deb depends on libfuse3-3, which noble replaced with libfuse3-4 -> the
    # install fails with "libfuse3-3 … not installable". jammy still ships it.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false          # a lean-build failure shouldn't hide a test one
      matrix:
        include:
          # lean analysis/aggregation image (no pytest).
          - variant: lean
            extras: ""
            infix: ""
          # test image: adds the [dev] extra (pytest) for the in-container
          # test chain. Named picasso-workflow-test-<version>.sif.
          - variant: test
            extras: "[dev]"
            infix: "test-"
    name: build-${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4

      # The image is ~1-2 GB (numba + scipy + the picasso stack); free runner disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL || true
          df -h /

      # Pin to <= the cluster's Apptainer (hpcl8 = 1.4.1): a .sif built by an
      # equal/older Apptainer runs on the cluster; a much newer one may not.
      - uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.6

      - name: Build the image
        env:
          # Override PW_REF only for release (bake the tag) and dispatch (bake the
          # input). On pull_request github.ref_name is the synthetic "<n>/merge"
          # ref, which is NOT a fetchable git ref — leave PW_REF empty so the def's
          # own pin (develop) is used and the clone resolves.
          PW_REF: ${{ github.event.inputs.pw_ref || (github.event_name == 'release' && github.ref_name) || '' }}
          PW_EXTRAS: ${{ matrix.extras }}
        run: |
          export APPTAINER_TMPDIR="$RUNNER_TEMP/apptainer-tmp"
          mkdir -p "$APPTAINER_TMPDIR"
          # bake the chosen ref + extras into the def (paint.def hard-codes both,
          # so a sed matches the existing PW_REF-injection pattern). PW_REF is
          # skipped on PR builds (PW_REF=develop, validated as written); PW_EXTRAS
          # is only injected for the non-lean variant.
          if [ -n "$PW_REF" ]; then
            sed -i "s|^    PW_REF=.*|    PW_REF=\"${PW_REF}\"|" deploy/apptainer/paint.def
          fi
          if [ -n "$PW_EXTRAS" ]; then
            sed -i "s|^    PW_EXTRAS=.*|    PW_EXTRAS=\"${PW_EXTRAS}\"|" deploy/apptainer/paint.def
          fi
          echo "Building ${{ matrix.variant }} with PW_REF=$(grep -oP '^\s*PW_REF=\"\K[^\"]+' deploy/apptainer/paint.def) PW_EXTRAS=$(grep -oP '^\s*PW_EXTRAS=\"\K[^\"]*' deploy/apptainer/paint.def)"
          apptainer build build.sif deploy/apptainer/paint.def

      - name: Smoke-test the image (imports the stack headlessly)
        run: apptainer test build.sif

      # C48 naming: filename = the picasso-workflow version (the submit-time match
      # key). Read it from the installed package METADATA via importlib.metadata,
      # not from picasso_workflow._version — that file is setuptools-scm-generated
      # and gitignored, so it isn't reliably shipped in the wheel (hence the
      # try/except in __init__). The dist-info version is always present. The
      # `test-` variant gets the matrix infix so it sits alongside the lean image.
      - name: Resolve C48 image name
        id: name
        run: |
          VERSION=$(apptainer exec build.sif \
            python -c "from importlib.metadata import version; print(version('picasso_workflow'))")
          INFIX="${{ matrix.infix }}"
          if [ "${{ github.event_name }}" = "release" ]; then
            OUT="picasso-workflow-${INFIX}${VERSION}.sif"
          else
            OUT="picasso-workflow-${INFIX}develop-${GITHUB_SHA::7}.sif"
          fi
          mv build.sif "$OUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sif=$OUT"         >> "$GITHUB_OUTPUT"
          echo "Built $OUT (picasso_workflow $VERSION, ${{ matrix.variant }})"

      # --- publish -------------------------------------------------------------
      # Ephemeral CI artifact per variant (always; good for verifying a build /
      # dispatch, and the hand-off to the `release` job below). The release
      # asset upload is NOT done here: two parallel matrix jobs hitting
      # softprops/action-gh-release on the same release would race on the
      # release object -- the dedicated `release` job (needs: build) uploads
      # both .sif files in one serialized step instead.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.sif }}
          path: ${{ steps.name.outputs.sif }}

  # Durable GitHub release assets (login node pulls them with curl/wget). Runs
  # once, AFTER both matrix builds, and uploads both variants' .sif in a single
  # action-gh-release call -- so there is no concurrent read-modify-write of the
  # release object (the race two in-matrix uploads would hit).
  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true    # flatten every variant's .sif into dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.sif

  # ghcr via ORAS — the C48-RECOMMENDED target (enables an automated login-node
  # refresh: `apptainer pull oras://ghcr.io/<owner>/picasso-workflow:<tag>`).
  # Needs `packages: write`; left off by default so this makes no org-package/
  # visibility decision. To enable, add a job that downloads the artifacts and
  # `apptainer push`es each to oras://ghcr.io/<owner>/picasso-workflow:<tag>.

# --- Private-repo adaptation (only if a jungmannlab repo becomes private) -------
# Don't put a git token inside %post (it can leak into the image). Instead:
#   1. actions/checkout the repo(s) with a PAT into ./ctx/picasso-workflow etc.
#   2. use a CI def with a `%files` section that COPIES ./ctx/* into the image and
#      `pip install`s from those local paths (no in-image git auth).
