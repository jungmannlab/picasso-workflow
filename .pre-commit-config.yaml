repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
# Use the maintained black mirror, pinned to the version the team runs locally
# so pre-commit and a manual `black` agree (keep in sync via
# `pre-commit autoupdate`). black reads line-length from [tool.black].
-   repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
    -   id: black
# flake8 reads its config from pyproject.toml [tool.flake8] via the
# Flake8-pyproject plugin (no separate pflake8 binary needed). The `exclude`
# regex (applied by pre-commit before flake8 runs) skips snapshot fixtures and
# the isolated experimental modules that still carry WIP F-codes -- flake8's
# own extend-exclude only filters directory walks, not the explicit file list
# pre-commit passes.
-   repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
    -   id: flake8
        additional_dependencies: [Flake8-pyproject]
        exclude: >
            (?x)^(
                picasso_workflow/(spinna_mle|spinna_mle_2|nn_redistribution)\.py
                |picasso_workflow/tests/TestData/
            )

# Intentionally NOT enabled:
#   - isort: would reorder imports across the whole codebase (large churn).
#   - bandit / mypy: not part of the current workflow.
#   - pytest / coverage: too slow to run on every commit (use CI / manual runs).
