[build-system]
requires = ["setuptools", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
dynamic= ["version"]
name = "picasso_workflow"
description = "Automation and documentation of DNA-PAINT analysis workflows"
license = {'file' = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "seaborn",
    "numpy",
    "pandas",
    "tables",
    "numba",
    "openpyxl==3.1.2",
    "picassosr==0.9.9",
    "moviepy==1.0.3",
    "python-dotenv==1.0.1",
    "pre-commit>=3.5.1",
    "bandit==1.7.8",
    # "coverage>=6.5,<6.6",
    "pytest==8.1.1",
    "isort==5.13.2",
    "aicspylibczi>=3.1.1",
    "fsspec>=2022.8.0",
    "aicsimageio",
    "psutil",
    "atlassian-python-api",
    "memory-profiler>=0.61.0",
    "loguru>=0.7.3",
    "h5py",
    # "mpi4py",
    # "openmpi"
]
keywords = ["picasso"]

[project.gui-scripts]
picasso-workflow-gui = "picasso_workflow.gui:main"

[project.optional-dependencies]
cluster = [
    "mpi4py>=4.0.2",
]

[tool.setuptools]
packages = ["picasso_workflow"]

[tool.setuptools_scm]
# Writes the version into a file that is importable at runtime, even when
# installed from a wheel or sdist (i.e. without a .git directory).
write_to = "picasso_workflow/_version.py"
# Shown when the package is imported outside a git repository and no tag
# is reachable (e.g. a fresh checkout with no tags yet).
fallback_version = "0.0.0.dev0"

[tool.setuptools.package-data]
picasso_workflow = ["picasso-workflow.ico"]

[tool.black]
line-length = 79
include = "\\.pyi?$"
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
strict = true

[tool.flake8]
max-line-length = 79
exclude = ".tox,.git,__pycache__,docs"
ignore = "E203,W503"
select = "C,E,F,W,B,B9,I"
# C: complexity
# E: pycodestyle errors
# F: pyflakes errors
# W: pycodestyle warnings
# B: bugbear errors
# B9: bugbear warnings
# I: isort errors
# Plugins
require-code = "True"
ban-relative-imports = "True"
docstring-convention = "google"
# flake8-bugbear
# flake8-eradicate
# flake8-docstrings

[tool.bandit]
exclude = "/tests"
skips = "B105,B404"
baseline = "bandit-baseline.json"
format = "txt"

[tool.pytest-cov]
[pytest-cov.run]
branch = "True"
[pytest-cov.report]
fail_under = 80

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["picasso_workflow/tests"]
markers = [
    "integration: tests that run the real picasso pipeline (deselect with '-m not integration')",
    "real_data: tests that require acquired datasets from the lab network volumes (set PW_TEST_DATA_DIR)",
]
