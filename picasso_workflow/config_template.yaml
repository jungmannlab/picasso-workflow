# Bundled package default — lowest priority.
#
# Config loading order (deep-merged, highest priority wins):
#   1. Per-user:   ~/.config/picasso_workflow/config.yaml
#   2. Site-wide:  C:\ProgramData\picasso_workflow\config.yaml  (Windows)
#                  /etc/picasso_workflow/config.yaml             (macOS/Linux)
#   3. This file:  bundled package default
#
# Each file only needs to specify the keys it wants to override.
Templates:
  TemplateName: "/local/path/to/template"
TestData:
  # Path to a directory of real acquired datasets used by integration tests.
  # Override in ~/.config/picasso_workflow/config.yaml (not here).
  # Alternatively set the environment variable PW_TEST_DATA_DIR.
  directory: null
# Non-secret Confluence connection settings only. The token is supplied via an
# environment variable, never stored here (operational: CONFLUENCE_TOKEN,
# legacy alias CONFLUENCE_BEARER; tests: TEST_CONFLUENCE_TOKEN).
Confluence: # operational target
  URL: ""
  Space: "~user"
  DefaultPage: ""
ConfluenceTest: # target for the pytest suite
  URL: ""
  Space: "~user"
  DefaultPage: ""
  Username: ""
SlurmDefault:
  nodes: 2
  cores: 12
  memory: "50GB"
  timeout: "24:00:00"
SlurmLoginNodes:
  clusterXXX: cluster001
ClusterEnvironment:
  pw_module: "picasso-workflow-gui"       # module name when use_pw_module is checked
  anaconda_module: "anaconda/3/2023.03"  # module name when use_pw_module is unchecked
  conda_env: "picasso-workflow"          # conda environment to activate
Drivepaths:
  machine.local:
    - "/local/machine/path"
  clusterXXX:
    - "/analogue/path/on/cluster"
  awindowsmachineXX:
    - "C:"
