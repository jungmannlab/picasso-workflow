# Bundled package default — lowest priority.
#
# Config loading order (deep-merged, highest priority wins):
#   1. Per-user:   ~/.config/picasso_workflow/config.yaml
#   2. Site-wide:  C:\ProgramData\picasso_workflow\config.yaml  (Windows)
#                  /etc/picasso_workflow/config.yaml             (macOS/Linux)
#   3. This file:  bundled package default
#
# Each file only needs to specify the keys it wants to override.
Templates:
  TemplateName: "/local/path/to/template"
TestData:
  # Path to a directory of real acquired datasets used by integration tests.
  # Override in ~/.config/picasso_workflow/config.yaml (not here).
  # Alternatively set the environment variable PW_TEST_DATA_DIR.
  directory: null
# Non-secret Confluence connection settings only. The token is supplied via an
# environment variable, never stored here (operational: CONFLUENCE_TOKEN,
# legacy alias CONFLUENCE_BEARER; tests: TEST_CONFLUENCE_TOKEN).
Confluence: # operational target
  URL: ""
  Space: "~user"
  DefaultPage: ""
ConfluenceTest: # target for the pytest suite
  URL: ""
  Space: "~user"
  DefaultPage: ""
  Username: ""
SlurmDefault:
  nodes: 2
  cores: 12
  gpus: 0                # GPUs/node to request (--gres=gpu:N); 0 = no GPU
  memory: "50GB"
  timeout: "24:00:00"
  partition: ""          # default partition preselected in the Run tab ("" = cluster default)
SlurmLoginNodes:
  clusterXXX: cluster001
# SLURM partitions offered in the Run tab's Partition dropdown, per cluster
# (keyed as in SlurmLoginNodes). GPU nodes usually live in a dedicated
# partition, so a --gres=gpu request must target one of these. The dropdown is
# editable, so an unlisted partition can still be typed by hand.
SlurmPartitions:
  clusterXXX:
    - "cpu"
    - "gpu"
ClusterEnvironment:
  pw_module: "picasso-workflow-gui"       # module name when use_pw_module is checked
  anaconda_module: "anaconda/3/2023.03"  # module name when use_pw_module is unchecked
  conda_env: "picasso-workflow"          # conda environment to activate
  clusterXXX:
    # Environment modules to `module load` in the SLURM job (editable in the
    # Run tab's Modules field). A CUDA module provides libNVVM + sets CUDA_HOME
    # so numba can run GPU fitting (e.g. spline-mle-gpu). Match the version to
    # the node driver's CUDA ceiling (see `nvidia-smi`).
    Modules:
      - cuda/13.0
# The GUI's "Start Workflow on Cluster" path always runs inside an Apptainer
# image on a shared mount, so the cluster runs the SAME pinned picasso-workflow
# version as the GUI (rather than whatever host conda env happens to be loaded).
# The Run tab's image dropdown lists the .sif files found in `image_dir` and
# defaults to picasso-workflow-<GUI version>.sif when it exists there.
ClusterApptainer:
  image_dir: "/sw/picasso-workflow"      # shared mount holding the .sif images
  module: "apptainer/1.4.1"              # apptainer env module to `module load`
  # Host paths bound into the container (`apptainer exec --bind`). The container
  # only sees what is bound in, so list every root the job reads/writes: the
  # scratch/data root and any template dirs. The run's results folder is bound
  # in automatically, so it need not be listed here.
  bind_paths:
    - "/scratch/paint"
  # Optional per-cluster override: a sub-dict keyed as in SlurmLoginNodes
  # overrides the keys above for that host (heterogeneous node groups with
  # different mounts / Apptainer versions). Only the keys you set are replaced;
  # unset keys fall back to the globals above.
  # clusterXXX:
  #   image_dir: "/sw2/picasso-workflow"
  #   module: "apptainer/1.5.2"
Drivepaths:
  machine.local:
    - "/local/machine/path"
  clusterXXX:
    - "/analogue/path/on/cluster"
  awindowsmachineXX:
    - "C:"
