  Space: "~hgrabmayr"
  DefaultPage: "test page"
SlurmHosts:
  - "hpcl8XXX"
SlurmDefault:
  nodes: 2
  cores: 12
  memory: "50GB"
  timeout: "24:00:00"
Drivepaths:
