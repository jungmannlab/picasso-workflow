    - "/Volumes/pool-miblab1"
  hpcl8XXX:
    - "/fs/mpib/pool-miblab"
    - "/fs/mpib/pool-miblab4"
    - "/fs/mpib/pool-miblab1"
  ipsjuXX:
    - "W:"
    - "X:"
    - "V:"